<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highlight Reels</title>
<style>
:root {
  --bg: #0f1113; --panel: #171a1d; --panel-2: #1e2226; --line: #2a2f35;
  --text: #e6e8ea; --dim: #8b939b; --faint: #5a626a;
  --ok: #3ecf6e; --bad: #ff5c5c; --warn: #f5b942; --accent: #4aa3ff;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
header h1 { margin: 0; font-size: 20px; font-weight: 650; }
.spacer { flex: 1; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: #3a4048; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: #1d3b2a; border-color: #2f6b47; }
.btn.danger { color: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px;
  text-align: left; cursor: pointer; position: relative; border-top: 4px solid var(--pc, var(--line)); }
.card:hover { border-color: #3a4048; border-top-color: var(--pc, #3a4048); background: #1a1d21; }
.card.missing { cursor: default; opacity: .7; }
.card.missing:hover { background: var(--panel); }
.who { display: flex; align-items: center; gap: 12px; }
.logo { width: 52px; height: 52px; border-radius: 8px; background: var(--panel-2); display: grid; place-items: center; overflow: hidden; flex: none;
  color: var(--faint); font-size: 22px; font-weight: 700; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.name { font-size: 16px; font-weight: 650; }
.sub { color: var(--dim); font-size: 12px; }
.folder { font: 12px var(--mono); color: var(--dim); word-break: break-all; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.stats b { font-weight: 600; }
.tag { position: absolute; top: 10px; right: 12px; font-size: 11px; color: var(--ok); }
.warn { color: var(--warn); font-size: 13px; }
.empty { color: var(--dim); padding: 30px 0; }
.msg { min-height: 20px; margin: 0 0 12px; color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Highlight Reels</h1>
    <span class="spacer"></span>
    <a class="btn" href="/players" style="color:var(--text);text-decoration:none">Player profiles</a>
    <button class="btn primary" id="newProj" disabled title="Coming next: pick a player, a clips folder and music">+ New project</button>
  </header>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = iso => iso ? new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : null;
let info = null;

async function load() {
  info = await (await fetch('/api/projects')).json();
  const g = $('grid');
  if (!info.projects.length) { g.innerHTML = '<div class="empty">No projects yet.</div>'; return; }
  g.innerHTML = info.projects.map((p, i) => {
    const pl = p.player;
    const initials = pl ? (pl.name || pl.id).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() : '?';
    const logo = pl && p.logo ? `<img src="/media/player/${esc(pl.id)}/logo" alt="">` : esc(initials);
    if (!p.exists || !p.ready) {
      return `<div class="card missing" style="--pc:${esc(pl ? pl.color : '')}">
        <div class="who"><div class="logo">${logo}</div><div><div class="name">${esc(pl ? pl.name : p.name)}</div></div></div>
        <div class="folder">${esc(p.folder)}</div>
        <div class="warn">${p.exists ? 'This folder isn\'t set up as a project yet' : 'Folder not found (moved or deleted?)'}</div>
        <div><button class="btn danger" data-remove="${i}">Remove from list</button>
          <span class="sub">(your files aren't touched)</span></div>
      </div>`;
    }
    return `<button class="card" data-open="${i}" style="--pc:${esc(pl ? pl.color : '')}">
      ${p.current ? '<span class="tag">open</span>' : ''}
      <div class="who"><div class="logo">${logo}</div>
        <div><div class="name">${esc(pl ? pl.name : 'No player linked')}${pl && pl.number ? ' #' + esc(pl.number) : ''}</div>
          <div class="sub">${esc(pl && pl.position || '')}</div></div></div>
      <div class="folder">${esc(p.folder)}</div>
      <div class="stats"><span><b>${p.clips}</b> clips</span><span><b>${p.confirmed}</b> confirmed</span>
        <span>${p.last_reel ? 'last reel ' + esc(when(p.last_reel)) : 'no reel yet'}</span></div>
    </button>`;
  }).join('');
}

$('grid').addEventListener('click', async e => {
  const o = e.target.closest('[data-open]'), r = e.target.closest('[data-remove]');
  if (r) {
    const p = info.projects[+r.dataset.remove];
    if (!confirm(`Remove ${p.name} from the list? Nothing on disk is deleted.`)) return;
    const res = await fetch('/api/projects/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folder: p.folder }) });
    if (!res.ok) { $('msg').textContent = (await res.json()).error || 'could not remove'; return; }
    return load();
  }
  if (!o) return;
  const p = info.projects[+o.dataset.open];
  if (p.current) { location = '/review'; return; }
  if (info.building) { $('msg').textContent = 'A reel is building. Switch projects when it\'s finished.'; return; }
  $('msg').textContent = '';
  o.style.opacity = .6;
  const res = await fetch('/api/projects/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folder: p.folder }) });
  if (!res.ok) { o.style.opacity = 1; $('msg').textContent = (await res.json()).error || 'could not open'; return; }
  location = '/review';
});
load();
</script>
</body>
</html>
