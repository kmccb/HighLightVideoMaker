<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Received</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0c; --text: #f2f0ec; --muted: #a3a1a9; --ember: #e85d2f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.6 "Inter", system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 560px; text-align: center; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; margin: 0 0 16px; }
  em { color: var(--ember); }
  p { color: var(--muted); }
  a { display: inline-block; margin-top: 20px; padding: 13px 24px; border-radius: 999px; background: var(--ember); color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Got it. <em>Your reel is in the queue.</em></h1>
  <p>We'll email you within a day to confirm the details and send a payment link. If we can't open your clips link, we'll let you know.</p>
  <a href="/">Back to the site</a>
</main>
</body>
</html>
